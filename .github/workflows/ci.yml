name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # git and ripgrep are runtime dependencies of the tool layer, not
      # conveniences — without them most of the suite fails.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # No OPENAI_API_KEY is provided: the suite must be hermetic. A test that
      # needs the network is a test that will fail on a bad day for no reason.
      - name: Run tests
        run: pytest -q -m "not benchmark and not sandbox"

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict --ignore-vuln GHSA-none || true

      - name: Fail if a secret was committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in git"; exit 1
          fi
          if git ls-files | grep -E '\.(pem|key|p12|pfx)$'; then
            echo "::error::key material is tracked in git"; exit 1
          fi

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-coding-workspace:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the image actually serves before it is a release candidate.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e OPENAI_API_KEY=sk-test-placeholder-not-used-in-this-check \
            -e FLASK_SECRET_KEY=ci-secret \
            ai-coding-workspace:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "healthy after ${attempt}s"; break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::container never became healthy"
              docker logs smoke; exit 1
            fi
            sleep 1
          done

          curl -fsS http://localhost:8000/healthz | grep -q '"status": "ok"'
          curl -fsS http://localhost:8000/ | grep -q "AI Coding Workspace"
          curl -sS http://localhost:8000/readyz | tee /dev/stderr | grep -q '"checks"'
          docker rm -f smoke

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      # Fill in for your platform (Fly, Render, ECS, Cloud Run...).
      # See docs/deployment.md for what each target needs.
      - name: Deploy
        run: echo "Configure the staging deploy step for your platform."

      - name: Staging smoke tests
        run: |
          echo "Poll STAGING_URL/readyz until ready, then exercise a read-only run."

  promote-production:
    name: Promote to production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    # Requires a manual reviewer on the 'production' environment in repo
    # settings — that approval gate is the point of this job.
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: echo "Configure the production deploy step for your platform."

      - name: Verify and roll back on failure
        run: |
          echo "Poll PRODUCTION_URL/readyz; on failure run the documented"
          echo "rollback in docs/deployment.md and fail this job."
