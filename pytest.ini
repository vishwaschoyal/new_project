[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    benchmark: live-model benchmark runs (require OPENAI_API_KEY; deselect with -m "not benchmark")
    sandbox: requires a reachable Docker daemon
filterwarnings =
    ignore::DeprecationWarning
